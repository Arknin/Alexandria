<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de Personagem</title>
<meta name="description" content="Ficha virtual de personagem">
<meta name="theme-color" content="#050506">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--panel:#0f1012;--line:#ffffff2e;--txt:#ece7da;--mut:#7f8386;--gold:#d8c9a3;--tn:#ff5a5f;--sn:#5aa9ff;
--l0:#4a4f53;--l1:#4fc27f;--l2:#4c9aff;--l3:#a56cf0;--l4:#e8b53c;
--disp:'Cormorant Garamond','Cinzel',Georgia,serif;--logo:'Cinzel',Georgia,serif;--sans:'Barlow',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 30% 0,#14161a,var(--bg) 60%);color:var(--txt);font:15px/1.5 var(--sans);padding:14px;min-height:100vh}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea,select{background:transparent;border:0;border-bottom:1px solid transparent;outline:0;min-width:0}
input:hover,textarea:hover,input:focus,textarea:focus,select:hover,select:focus{border-bottom-color:var(--mut)}
button,a{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.frame{max-width:1180px;margin:auto;border:1px solid var(--line);padding:30px 34px;position:relative}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid #ffffff14;pointer-events:none}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:14px}.rule{height:1px;margin:0 0 26px;background:linear-gradient(90deg,transparent,#ffffff55 12%,#ffffff55 88%,transparent)}.rres{margin-top:8px;font-size:13px;color:var(--mut)}.rres div:first-child{color:var(--txt)}.rres b{font:700 24px var(--disp);color:var(--gold)}.add label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut)}
#name{font:500 clamp(28px,5vw,44px)/1.1 var(--logo);letter-spacing:.14em;flex:1 1 280px}
.tag{font:600 12px var(--sans);letter-spacing:.08em;background:#2f7d4f;color:#eafff1;padding:3px 12px;border-radius:3px}
#apt{width:auto;text-align:center;text-transform:uppercase;border:0;appearance:none;-webkit-appearance:none;cursor:pointer;color-scheme:dark}
.ghost{display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .2s;font:600 14px var(--disp)}
.ghost:hover,.ghost:focus-within{opacity:1}
.ghost input,.ghost select{background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:3px;color-scheme:dark}
.nav{border:1px solid var(--gold);color:var(--gold);background:none;padding:5px 14px;border-radius:3px;text-decoration:none;font:600 14px var(--disp);letter-spacing:.06em}
.nav:hover{background:#d8c9a31a}
h2{font:700 22px var(--disp);letter-spacing:.12em;color:var(--gold);margin:0 0 12px;text-transform:uppercase}
.main{display:grid;grid-template-columns:1fr minmax(260px,390px);gap:30px}
.top{display:flex;flex-wrap:wrap;gap:30px 56px;margin-bottom:28px}
.at{display:grid;grid-template-columns:150px auto auto auto 66px auto;align-items:center;gap:8px;padding:2px 0}
.an{font:italic 700 25px/1.2 var(--disp)}
.ch{border:1px solid var(--line);background:var(--panel);color:var(--txt);font:700 17px var(--sans);min-width:30px;height:30px;display:grid;place-items:center;border-radius:5px}
.sm{width:24px;height:24px;border:1px solid var(--line);background:none;border-radius:50%;line-height:1;color:var(--mut)}
.sm:hover:not(:disabled){color:var(--txt);border-color:var(--txt)}
.sm:disabled{opacity:.25;cursor:not-allowed}
.mod{color:var(--mut);font-size:13px;text-align:right}
.d{border:1px solid var(--line);background:none;border-radius:4px;font:600 11px var(--sans);padding:3px 6px;color:var(--mut)}
.d:hover{color:var(--gold);border-color:var(--gold)}
.pool{margin-top:8px;font-size:13px;color:var(--mut);max-width:430px}
.pool b{color:var(--gold);font-size:17px}
.link{background:none;border:0;color:var(--sn);text-decoration:underline;padding:0}
.vit{display:grid;grid-template-columns:auto auto;align-items:center;gap:10px 18px;align-content:start}
.vn{display:flex;align-items:baseline;gap:12px;font:600 30px var(--disp)}
.vn span{font:700 46px/1 var(--disp)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
.sk{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:7px;padding:2px 0;border-bottom:1px solid #ffffff0d}
.sk .n{font:italic 600 17px var(--disp);cursor:pointer}
.die{background:none;border:0;padding:0;width:36px;height:36px;position:relative;color:var(--c,var(--mut))}.die svg{width:100%;height:100%;display:block}.die b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--sans);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}.die.spin svg{animation:sp .7s ease-in-out}@keyframes sp{to{transform:rotate(720deg) scale(1.15)}}@media(prefers-reduced-motion:reduce){.die.spin svg{animation:none}}
.star{color:var(--gold);margin-left:2px}
.sq{border:1px solid var(--line);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--txt);font:700 12px var(--sans)}
.ab{background:none;border:0;color:var(--mut);font:500 10px var(--sans);width:28px;padding:0;text-align:left}
.x{background:none;border:0;color:var(--mut);font-size:15px;padding:0 4px}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;max-width:480px}
.add input,.add select{background:var(--panel);border:1px solid var(--line);padding:4px 8px;flex:1 1 100px;border-radius:3px}
.btn{background:none;border:1px solid var(--line);padding:4px 14px;border-radius:3px;color:var(--txt)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:11px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);margin-right:5px}
.tal{border-left:2px solid var(--gold);padding:4px 12px;margin-bottom:14px;position:relative}
.tal input{width:calc(100% - 28px);font:700 20px var(--disp)}
.tal textarea{width:100%;resize:vertical;min-height:58px;color:#c9c5ba;display:block}
.tal .x{position:absolute;top:4px;right:0}
.art{display:block;position:relative;cursor:pointer;min-height:300px;border:1px dashed #ffffff22;text-align:center;overflow:hidden}
.art span{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff3a;font-size:14px;padding:20px}
.art input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.art img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 22%);mask-image:linear-gradient(to right,transparent,#000 22%)}
.art.has{border:0;min-height:0}
.rm{margin-top:6px}#part img{-webkit-mask-image:none;mask-image:none}.tal .tg{width:15px;height:15px;accent-color:var(--gold);vertical-align:middle;margin-right:4px}.bw{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}.bw select,.bw input{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 6px;font:500 13px var(--sans)}.bw select{max-width:62%}.tal .bw input,.layer .bw input{width:64px;display:inline-block;margin:0;font:500 13px var(--sans)}.tgl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px;margin-top:4px}.layer .tgl input,.tal .tgl input{width:15px;display:inline-block;margin:0}.st{display:grid;grid-template-columns:42px 176px 42px;align-items:center;column-gap:6px}.st .sname{font:italic 600 18px var(--disp);color:var(--txt);white-space:nowrap;min-width:176px;text-align:center}.arw{background:none;border:0;padding:0;width:42px;height:24px;cursor:pointer}.arw img{width:100%;height:100%;object-fit:contain;display:block}.arw.r img{transform:scaleX(-1)}.arw:disabled{opacity:.2;cursor:not-allowed}.arw:hover:not(:disabled) img{filter:brightness(1.25)}.top .vit{flex:1 1 auto}@media(max-width:640px){.vit{grid-template-columns:auto minmax(0,1fr);width:100%}.st{grid-template-columns:36px minmax(0,1fr) 36px;width:100%}.st .sname{font-size:15px;white-space:normal;line-height:1.15}.arw{width:36px}.vn{font-size:24px}.vn span{font-size:38px}}.bn{font-style:italic;color:var(--mut);font-size:12px;font-weight:400}.tt{font:700 20px var(--disp)}.tt small{font:500 11px var(--sans);color:var(--mut)}.td{color:#c9c5ba}.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.pc{border:1px solid var(--line);padding:10px;text-align:center;display:flex;flex-direction:column;gap:8px}.pc.off{opacity:.3}.pc b{min-height:2.7em;display:flex;align-items:center;justify-content:center;line-height:1.3}.pc .btn{margin-top:auto}.pi{aspect-ratio:1;border-radius:50%;background:#ffffff08;overflow:hidden}.pi img{width:100%;height:100%;object-fit:cover;display:block}.lk{font-size:12px;color:var(--mut);text-decoration:underline;cursor:pointer}.ptop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}.ptop h2{margin:0}.layer h4{font:600 15px var(--disp);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 4px}.it{margin-bottom:8px;position:relative}.it b{font:700 18px var(--disp)}.it .x{position:absolute;top:0;right:0}details{margin-top:4px;color:#b5b2a8;font-size:14px}summary{cursor:pointer;color:var(--mut);font-style:italic}details p{margin:4px 0}.bonus{font-style:italic;color:var(--mut);font-size:13px;margin-top:8px}.dim{opacity:.55}.layer input,.layer textarea{width:100%;display:block;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:3px;margin:3px 0}.layer textarea{min-height:50px;resize:vertical}.edtools{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}.edtools textarea{width:100%;background:var(--panel);border:1px solid var(--line)}
.side{position:sticky;top:14px;align-self:start}
.log{position:sticky;bottom:10px;margin:22px auto 0;max-width:620px;background:#000d;border:1px solid var(--line);padding:8px 14px;text-align:center;border-radius:4px;font-size:14px}
.log b{font:700 24px var(--disp);color:var(--gold)}
.crit{color:var(--l1)}.fail{color:var(--tn)}
.layer{margin-bottom:28px}
.layer h3{font:700 24px var(--disp);margin:0 0 10px;display:flex;align-items:center;gap:12px;letter-spacing:.05em}
.layer h3::after{content:"";flex:1;height:1px;background:var(--line)}
.pgrid{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:34px}
@media(max-width:900px){.main,.pgrid{grid-template-columns:1fr}.frame{padding:20px 16px}.side{position:static;order:-1}.skills{grid-template-columns:1fr}.at{grid-template-columns:110px auto auto auto 58px auto}.an{font-size:21px}}
.bar{max-width:1180px;margin:0 auto 10px;display:flex;align-items:center;gap:14px;font:600 14px var(--sans);color:var(--mut)}.bar a{color:var(--gold);text-decoration:none;font:700 18px var(--logo);letter-spacing:.12em}.bar .sp{flex:1}.bar #stat{font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000e;border:1px solid var(--gold);padding:8px 16px;border-radius:6px;z-index:9;max-width:90vw;text-align:center}
.auth{max-width:340px;margin:20px auto;display:flex;flex-direction:column;gap:10px}.auth input,#v-app .add input,#v-app select{background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:3px;width:100%;color-scheme:dark}.err{color:var(--tn);min-height:1.2em;font-size:14px}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:28px}.cc{text-decoration:none;color:inherit}.cc:hover{border-color:var(--gold)}.mut{color:var(--mut)}
a.pi{display:block}.fl{cursor:pointer;display:inline-block}.cfg{display:flex;flex-direction:column;gap:12px;align-items:flex-start}.cfg .add{width:100%}.code{font-family:var(--logo);letter-spacing:.2em;color:var(--gold)}
#v-app h2{margin-top:26px}#v-app header h2{margin-top:0}#v-app .paths{margin-bottom:14px}#v-app a.btn{text-decoration:none;display:inline-block}
.mrow{display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid #ffffff0d}.mrow span:first-child{flex:1}
.sum{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:30px}.sum .at{grid-template-columns:150px auto auto}.sum .art img{mask-image:none;-webkit-mask-image:none}
@media(max-width:900px){.sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden></div>
<main class="frame" id="v-app" hidden></main>
<div class="toast" id="toast" role="status" hidden></div>
<main class="frame" id="v-ficha" hidden>
<header>
  <input id="name" placeholder="NOME" aria-label="Nome">
  <select id="apt" class="tag" aria-label="Aptidão"></select>
  <div class="ghost"><input id="pocao" readonly placeholder="Poção atual" aria-label="Nome da poção atual"><label>Camada <select id="camada" aria-label="Camada atual"></select></label></div>
  <a class="nav" id="lnkBack" href="#camps">‹ Campanha</a>
  <a class="nav" id="lnkPocao" href="#pocao">Habilidades da Poção</a>
</header>
<div class="rule"></div>

<div class="main">
  <div>
    <div class="top">
      <div>
        <h2>Atributos</h2>
        <div id="attrs"></div>
        <div class="pool" id="pool"></div>
      </div>
      <div class="vit">
        <div class="vn" style="color:var(--tn)">TN <span id="tn"></span></div><div class="st" id="stt"></div>
        <div class="vn" style="color:var(--sn)">SN <span id="sn"></span></div><div class="st" id="sts"></div>
      </div>
    </div>
    <h2>Perícias</h2>
    <div class="skills"><div id="sk1"></div><div id="sk2"></div></div>
    <div class="add">
      <input id="nsk" placeholder="Nova perícia" aria-label="Nome da nova perícia">
      <select id="nsa" aria-label="Atributo da nova perícia"></select>
      <label><input type="checkbox" id="nsp"> Especial</label><button class="btn" id="addsk">Adicionar</button>
    </div>
    <div class="leg" id="leg"></div>
    <h2 style="margin-top:34px">Talentos</h2>
    <div id="tals"></div>
    <button class="btn" id="addtal">Adicionar talento</button>
  </div>
  <aside class="side">
    <label class="art" id="art"><span>Adicionar imagem (PNG)</span><img alt="Imagem do personagem" hidden><input type="file" accept="image/*"></label>
    <button class="btn rm" id="rm" hidden>Remover imagem</button>
    <button class="link" id="expFicha" style="display:block;margin-top:10px">Exportar ficha (arquivo)</button>
    <div class="roller"><h2 style="font-size:18px;margin-top:20px">Rolagem</h2><div class="add" style="margin-top:0"><input id="expr" value="1d20" placeholder="2d10+3, (1d8+2)*2" aria-label="Expressão de dados"><button class="btn" id="rollx">Rolar</button></div><div id="rres" class="rres" aria-live="polite"></div></div>
  </aside>
</div>
</main>

<main class="frame" id="v-pocao" hidden>
<header>
  <a class="nav" id="lnkPBack" href="#ficha">Voltar</a>
  <h2 id="ptitle" style="margin:0;font-size:30px">Habilidades da Poção</h2>
</header>
<div class="rule"></div>
<div id="pick"></div>
<div class="pgrid" id="pg">
  <div>
    <label class="art" id="part"><span>Adicionar imagem (PNG)</span><img alt="Imagem da poção" hidden><input type="file" accept="image/*"></label>
    <button class="btn rm" id="prm" hidden>Remover imagem</button>
  </div>
  <div id="layers"></div>
</div>
</main>
<div class="log" id="log" role="status" aria-live="polite" hidden></div>

<script>
const A=[['combate','Combate','COM','#ef5350'],['fisico','Físico','FÍS','#f39a3d'],['agilidade','Agilidade','AGI','#e6d44a'],['percepcao','Percepção','PER','#3fc9c0'],['inteligencia','Inteligência','INT','#4c9aff'],['vontade','Vontade','VON','#a56cf0'],['carisma','Carisma','CAR','#ec6fb0']];
const LV=['Destreinado','Aprendiz','Apto','Mestre','Grão-Mestre'];
const SK=[['Adestrar','carisma'],['Alquimia','inteligencia',1],['Apostar','inteligencia'],['Atletismo','fisico'],['Barganha','carisma'],['Corpo a Corpo Marcial','combate'],['Corpo a Corpo Simples','combate'],['Coordenação','agilidade'],['Dedução','inteligencia'],['Demolição','inteligencia',1],['Discernir','percepcao'],['Disfarçar','carisma'],['Disparo Marcial','agilidade',1],['Disparo Simples','agilidade',1],['Educação','inteligencia'],['Encanto','carisma'],['Escutar','percepcao'],['Escrutinar','percepcao'],['Falsificar','inteligencia',1],['Furtividade','agilidade'],['Guerrilha','inteligencia',1],['Interrogar','vontade'],['Intimidar','vontade'],['Investigar','percepcao'],['Lábia','carisma'],['Liderar','carisma',1],['Malícia','carisma'],['Manufaturar','inteligencia'],['Medicina','inteligencia',1],['Misticismo','percepcao',1],['Navegação','inteligencia',1],['Pilotagem','agilidade'],['Prestidigitação','agilidade',1],['Sobrevivência','percepcao'],['Tenacidade','fisico'],['Virtude','vontade'],['Vivência','inteligencia']];
const DIE='<svg viewBox="0 0 40 40" fill="currentColor" stroke="#050506" stroke-width="1.6" stroke-linejoin="round"><path d="M20 2 36 11v18L20 38 4 29V11z"/><path d="M20 13 31 28H9z" fill="none"/><path d="M20 2v11M36 11 31 28 36 29M4 11l5 17-5 1M9 28l11 10 11-10" fill="none"/></svg>';
const L=[9,8,7,6,5,4,3,2,1,0];
const APT={Policial:[['Sono Leve','Enquanto dorme, você não pode ser pego desprevenido ou ficar À Mercê.'],['Olho de Águia','Você não sofre desvantagem enquanto atira com uma arma de fogo a média distância, tratando isso como curta distância.'],['Postura Amedrontadora','Quando você faz um teste para intimidar um alvo você ganha +2 no teste de Intimidação.','Intimidar+2']],Ladrão:[['Discreto','Você sempre passa em testes de Prestidigitação para esconder objetos não maiores do que uma faca de uma pessoa comum.'],['Arrombador','Enquanto tentando abrir uma fechadura você ganha +2 no teste de Prestidigitação.','Prestidigitação+2'],['Sabedoria das Ruas','Enquanto lidando com produtos do mercado negro ou procurando informações ilegais, você ganha +2 no teste de barganha.','Barganha+2']],Erudito:[['Sono Leve','Enquanto dorme, você não pode ser pego desprevenido ou ficar À Mercê.'],['Multilinguística','Você sabe um pouco sobre todas as línguas, permitindo você fazer teste para decifrar todas elas ou alguém falando elas. Em contraponto, você pode escolher 1 língua para dominar, se tornando fluente nela, mas você perde o efeito anterior.'],['Operador','Quando você rola um teste para controlar um máquina ou calcular a distância exata para ela acertar alguém você ganha +2 no teste de Guerrilha','Guerrilha+2']]};
const KEYS=['name','apt','camada','free','attrs','skills','tals','img','path','toff','ten','sn'];
const clone=x=>JSON.parse(JSON.stringify(x));
const newSheet=()=>({name:'',apt:'',camada:9,free:false,attrs:Object.fromEntries(A.map(a=>[a[0],1])),skills:SK.map(s=>({n:s[0],a:s[1],sp:s[2]||0,l:0,c:0})),tals:[{t:'',d:''}],img:'',path:'',toff:{},ten:0,sn:0});
function norm(d){const n=newSheet();KEYS.forEach(k=>{if(d&&d[k]!==undefined)n[k]=clone(d[k])});
  const old=n.skills;n.skills=SK.map(s=>{const o=old.find(x=>x.n===s[0]);return o?Object.assign(o,{sp:s[2]||0}):{n:s[0],a:s[1],sp:s[2]||0,l:0,c:0}}).concat(old.filter(x=>x.c));
  if(n.apt&&!APT[n.apt])n.apt='';return n}
let S=newSheet(),BASE={},SH=null,CAMP=null,ME=null,CP={pd:{},pimgs:{},paths:{}},UI={edit:false},CUR='',PX={mode:'sheet',path:''},STAT='';
const isMaster=()=>!!CAMP&&CAMP.role==='master';
const canLayers=()=>isMaster()||!!(CAMP&&CAMP.allow_layers);
const ED=()=>UI.edit&&isMaster();
const pxPath=()=>PX.mode==='sheet'?S.path:PX.path;
const pxCam=()=>PX.mode==='sheet'?S.camada:0;
const $=id=>document.getElementById(id);
const mod=v=>v<=0?-1:Math.min(3,Math.floor(v/2));
const fm=n=>(n>=0?'+':'−')+Math.abs(n);
const pool=()=>{const v=Object.values(S.attrs);return 17+2*v.filter(x=>x===0).length-v.reduce((s,x)=>s+Math.max(0,x-1),0)};
const AI=k=>A.find(a=>a[0]===k);
const nz=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const lay=(p,n)=>(CP.pd[p]||{})[n]||{n:'',ch:[],hab:[],mel:[],bon:''};

function roll(btn,label,m,b,sp){btn.classList.add('spin');setTimeout(()=>{btn.classList.remove('spin');
  const d=1+Math.floor(Math.random()*20),p=sp?1+Math.floor(Math.random()*6):0,t=d+m+b-p,c=d===20?'crit':d===1?'fail':'',g=$('log');
  btn.querySelector('b').textContent=t;g.hidden=false;
  g.innerHTML=`${label}${sp?' (desvantagem)':''}: d20 (<span class="${c}">${d}</span>) ${fm(m)} atributo ${b?fm(b)+' bônus ':''}${p?'− d6 ('+p+') ':''}= <b>${t}</b>${d===20?' · 20 natural':d===1?' · 1 natural':''}`},700)}

function rollExpr(src){const det=[];let s=src.replace(/\s+/g,'').toLowerCase().replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  s=s.replace(/(\d*)d(\d+)/g,(_,n,f)=>{n=+n||1;f=+f;if(n>100||f>1000||f<1)throw 0;const r=[];for(let i=0;i<n;i++)r.push(1+Math.floor(Math.random()*f));det.push(`${n}d${f} [${r.join(', ')}]`);return r.reduce((a,b)=>a+b,0)});
  let i=0;const pk=()=>s[i];
  const ex=()=>{let v=tm();while(pk()==='+'||pk()==='-'){const o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v};
  const tm=()=>{let v=fc();while(pk()==='*'||pk()==='/'){const o=s[i++],r=fc();if(o==='/'&&r===0)throw 0;v=o==='*'?v*r:v/r}return v};
  const fc=()=>{if(pk()==='-'){i++;return -fc()}if(pk()==='('){i++;const v=ex();if(pk()!==')')throw 0;i++;return v}const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]};
  const v=ex();if(i<s.length)throw 0;return{v:Math.round(v*100)/100,det}}
const hist=[],esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function doRoll(){const src=$('expr').value.trim();let r;
  try{r=rollExpr(src)}catch(e){$('rres').innerHTML='<div>Expressão inválida. Exemplos: 1d6, 2d10+3, (1d8+2)*2</div>';return}
  hist.unshift(`${esc(src)}${r.det.length?' · '+r.det.join(' ; '):''}`);hist.length=Math.min(hist.length,5);
  $('rres').innerHTML=hist.map((h,k)=>k?`<div>${h}</div>`:`<div><b>${r.v}</b> ${h}</div>`).join('')}

async function api(m,u,b){const r=await fetch(u,{method:m,credentials:'same-origin',headers:Object.assign({'X-Requested-With':'fetch'},b!==undefined?{'Content-Type':'application/json'}:{}),body:b!==undefined?JSON.stringify(b):undefined});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||('Erro '+r.status));e.status=r.status;throw e}return j}
const setStatus=t=>{STAT=t;const e=$('stat');if(e)e.textContent=t};

const go=h=>{if(location.hash==='#'+h)route();else location.hash='#'+h};
const diffPatch=()=>{const p={};KEYS.forEach(k=>{if(JSON.stringify(S[k])!==JSON.stringify(BASE[k]))p[k]=clone(S[k])});return p};
const pending=()=>!!SH&&!SH.summary&&KEYS.some(k=>JSON.stringify(S[k])!==JSON.stringify(BASE[k]));
let saveT=null,saving=false;
function save(){if(!pending())return;setStatus('Salvando…');clearTimeout(saveT);saveT=setTimeout(flush,500)}
async function flush(){clearTimeout(saveT);saveT=null;if(saving){saveT=setTimeout(flush,300);return}if(!pending()){setStatus('Salvo');return}
  const patch=diffPatch(),sid=SH.id;saving=true;
  try{const r=await api('PATCH','/api/sheets/'+sid,{patch});if(SH&&SH.id===sid){Object.keys(patch).forEach(k=>BASE[k]=clone(patch[k]));SH.rev=r.rev}setStatus('Salvo')}
  catch(e){saving=false;
    if(e.status===401){ME=null;route();return}
    if(e.status&&e.status<500&&e.status!==429){toast(e.message);setStatus('Não salvo');try{await reloadSheet(true);repaint()}catch(x){}return}
    setStatus('Sem conexão — tentando de novo…');saveT=setTimeout(flush,3000);return}
  saving=false;if(pending()&&!saveT)save()}
let potT=null,potDirty=false;
function savePot(){potDirty=true;setStatus('Salvando…');clearTimeout(potT);potT=setTimeout(async()=>{try{await api('PUT','/api/campaigns/'+CAMP.id+'/potions',{potions:CP});potDirty=false;setStatus('Salvo')}catch(e){setStatus('Erro ao salvar');toast(e.message)}},600)}

function listen(cid){if(ES&&ESid===cid)return;stopES();ESid=cid;ES=new EventSource('/api/events?campaign='+encodeURIComponent(cid));
  ES.addEventListener('changed',refreshSoon);ES.addEventListener('kicked',()=>{stopES();toast('Você foi removido da campanha.');CAMP=null;SH=null;go('camps')});ES.onerror=()=>setStatus('Reconectando…');ES.onopen=()=>{if(STAT==='Reconectando…'){setStatus('Salvo');refreshSoon()}}}

async function refreshAll(){if(!ME||!CAMP||saving)return;
  try{await loadCamp(CAMP.id)}catch(e){if(e.status===404||e.status===403){toast('Você não tem mais acesso a esta campanha.');stopES();CAMP=null;SH=null;go('camps')}return}
  if(SH){const e=CAMP.sheets.find(s=>s.id===SH.id);if(!e){toast('Esta ficha foi removida.');SH=null;go('c/'+CAMP.id);return}
    try{if(SH.summary){const r=await api('GET','/api/sheets/'+SH.id);if(!r.summaryOnly){route();return}SH.sum=r.summary}else if(e.rev>SH.rev){await reloadSheet()}}catch(x){return}}
  if(CUR!=='camps'&&CUR!=='auth')safeRender()}
async function reloadSheet(force){const r=await api('GET','/api/sheets/'+SH.id);if(r.summaryOnly){route();return}
  const n=norm(r.data);KEYS.forEach(k=>{const loc=JSON.stringify(S[k])!==JSON.stringify(BASE[k]);if(force||!loc)S[k]=clone(n[k])});BASE=clone(r.data||{});SH.rev=r.rev;if(pending())save()}
function repaint(){if(CUR==='cpot'){potHeader();renderPot()}else if(CUR==='camp')renderCamp();else if(CUR==='sum')renderSummary();else if(CUR==='sheet'||CUR==='spot')render()}
let pendingRender=false;
function safeRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('.frame')){pendingRender=true;return}repaint()}
addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){pendingRender=false;repaint()}},60)});

function renderBar(){const b=$('bar');b.hidden=!ME;if(!ME)return;
  b.innerHTML=`<a href="#camps">Ficha Virtual</a><span class="sp"></span><span id="stat">${esc(STAT)}</span><span>${esc(ME.username)}</span><button class="link" id="out">Sair</button>`;
  $('out').onclick=async()=>{try{await api('POST','/api/logout',{})}catch(e){}ME=null;CAMP=null;SH=null;stopES();go('camps')}}
function renderAuth(){const v=$('v-app');let reg=false;
  const draw=()=>{v.innerHTML=`<header><h2 style="margin:0;font-size:30px">Ficha Virtual</h2></header><div class="rule"></div><form class="auth" id="af"><h2>${reg?'Criar conta':'Entrar'}</h2><input id="au" placeholder="Usuário" autocomplete="username" maxlength="24" required><input id="ap" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="${reg?'new-password':'current-password'}" required><div class="err" id="ae" role="alert"></div><button class="btn">${reg?'Criar conta':'Entrar'}</button><button type="button" class="link" id="atg">${reg?'Já tenho uma conta':'Criar uma conta'}</button></form>`;
    $('atg').onclick=()=>{reg=!reg;draw()};
    $('af').onsubmit=async e=>{e.preventDefault();try{const r=await api('POST',reg?'/api/register':'/api/login',{username:$('au').value.trim(),password:$('ap').value});ME=r.user;go(location.hash.startsWith('#c/')||location.hash.startsWith('#s/')?location.hash.slice(1):'camps')}catch(x){$('ae').textContent=x.message}}};
  draw()}
async function renderCamps(){const r=await api('GET','/api/campaigns'),v=$('v-app');
  v.innerHTML=`<header><h2 style="margin:0;font-size:30px;flex:1">Campanhas</h2></header><div class="rule"></div><div class="paths" id="cl"></div><div class="forms"><div><h2>Criar campanha</h2><div class="add"><input id="cn" maxlength="60" placeholder="Nome da campanha"><button class="btn" id="cc">Criar</button></div></div><div><h2>Entrar com código</h2><div class="add"><input id="cj" maxlength="8" placeholder="Código de convite"><button class="btn" id="cjb">Entrar</button></div></div></div>`;
  const g=$('cl');if(!r.campaigns.length)g.outerHTML='<p class="mut">Você ainda não participa de nenhuma campanha. Crie uma ou entre com o código que o mestre enviou.</p>';
  r.campaigns.forEach(c=>{const e=mk('a','pc cc',`<b>${esc(c.name)}</b><span class="tag">${c.role==='master'?'MESTRE':'JOGADOR'}</span><small>${c.players} participante(s)</small>`);e.href='#c/'+c.id;g.append(e)});
  $('cc').onclick=async()=>{try{const x=await api('POST','/api/campaigns',{name:$('cn').value});go('c/'+x.id)}catch(e){toast(e.message)}};
  $('cjb').onclick=async()=>{try{const x=await api('POST','/api/campaigns/join',{code:$('cj').value});go('c/'+x.id)}catch(e){toast(e.message)}}}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function newSheetIn(data,owner){const r=await api('POST','/api/campaigns/'+CAMP.id+'/sheets',{owner_id:owner||undefined,data:data||newSheet()});go('s/'+r.id)}
function renderCamp(){const c=CAMP,M=isMaster(),v=$('v-app');
  const owners=c.members.map(m=>`<option value="${m.user_id}">${esc(m.username)}${m.role==='master'?' (mestre)':''}</option>`).join('');
  v.innerHTML=`<header><a class="nav" href="#camps">‹ Campanhas</a><h2 style="margin:0;font-size:30px;flex:1">${esc(c.name)}</h2><span class="tag">${M?'MESTRE':'JOGADOR'}</span><a class="nav" href="#c/${c.id}/pocao">Poções</a></header><div class="rule"></div><div id="cb"></div>`;
  const b=$('cb');b.append(mk('h2','','Fichas'));const g=mk('div','paths','');
  c.sheets.forEach(s=>{const mine=s.owner_id===c.me,full=M||mine;
    const e=mk('div','pc',`<a class="pi" href="#s/${s.id}">${s.img?`<img src="${s.img}" alt="">`:''}</a><b>${esc(s.name||'Sem nome')}</b><small>${esc(s.owner_name)}${mine?' · <i>sua ficha</i>':''}</small><a class="btn" href="#s/${s.id}">${full?'Abrir':'Ver resumo'}</a>`);
    if(M){const sel=mk('select','',owners);sel.value=s.owner_id;sel.title='Dono da ficha';sel.onchange=async()=>{try{await api('PATCH','/api/sheets/'+s.id+'/owner',{owner_id:sel.value})}catch(x){toast(x.message)}};e.append(sel)}
    if(full){const d=mk('button','link','Excluir');d.onclick=async()=>{if(confirm('Excluir a ficha "'+(s.name||'Sem nome')+'"?'))try{await api('DELETE','/api/sheets/'+s.id)}catch(x){toast(x.message)}};e.append(d)}
    g.append(e)});
  if(!c.sheets.length)g.append(mk('p','mut','Nenhuma ficha ainda.'));b.append(g);
  const nr=mk('div','add',`${M?`<select id="nown" aria-label="Dono da nova ficha">${owners}</select>`:''}<button class="btn" id="nsh">Nova ficha</button><label class="btn fl">Importar ficha (arquivo)<input type="file" accept=".json,application/json" hidden id="imp"></label>${localStorage.getItem('ficha3')?'<button class="btn" id="impl">Importar ficha salva neste navegador</button>':''}`);b.append(nr);
  const own=()=>M?$('nown').value:undefined;
  $('nsh').onclick=()=>newSheetIn(null,own()).catch(e=>toast(e.message));
  $('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());await newSheetIn(norm(j.data||j),own())}catch(x){toast(x.status?x.message:'Arquivo inválido')}};
  if($('impl'))$('impl').onclick=()=>{try{newSheetIn(norm(JSON.parse(localStorage.getItem('ficha3'))),own()).catch(e=>toast(e.message))}catch(x){toast('Dados locais inválidos')}};
  if(M){b.append(mk('h2','','Configurações'));
    const st=mk('div','cfg',`<label class="tgl"><input type="checkbox" id="alw" ${c.allow_layers?'checked':''}> Permitir que os jogadores subam e desçam as camadas das próprias fichas</label><div class="add"><input id="rn" maxlength="60" value="${esc(c.name)}" aria-label="Nome da campanha"><button class="btn" id="rb">Renomear</button></div><p class="mut">Código de convite: <b class="code">${esc(c.join_code||'')}</b> <button class="link" id="cp">copiar</button></p><button class="link" id="dc">Excluir campanha</button>`);b.append(st);
    $('alw').onchange=async e=>{try{await api('PATCH','/api/campaigns/'+c.id,{allow_layers:e.target.checked})}catch(x){toast(x.message)}};
    $('rb').onclick=async()=>{try{await api('PATCH','/api/campaigns/'+c.id,{name:$('rn').value});toast('Nome atualizado')}catch(x){toast(x.message)}};
    $('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(c.join_code).then(()=>toast('Código copiado'),()=>{})};
    $('dc').onclick=async()=>{if(prompt('Isto apaga a campanha e TODAS as fichas. Digite o nome da campanha para confirmar:')===c.name)try{await api('DELETE','/api/campaigns/'+c.id);CAMP=null;go('camps')}catch(x){toast(x.message)}}}
  b.append(mk('h2','','Participantes'));const ml=mk('div','mem','');
  c.members.forEach(m=>{const r=mk('div','mrow',`<span>${esc(m.username)}</span><span class="tag">${m.role==='master'?'MESTRE':'JOGADOR'}</span>`);
    if(m.role!=='master'&&(M||m.user_id===c.me)){const x=mk('button','link',m.user_id===c.me?'Sair da campanha':'Remover');x.onclick=async()=>{if(confirm(m.user_id===c.me?'Sair desta campanha?':'Remover '+m.username+' da campanha?'))try{await api('DELETE','/api/campaigns/'+c.id+'/members/'+m.user_id)}catch(e){toast(e.message)}};r.append(x)}
    ml.append(r)});b.append(ml)}
function renderSummary(){const s=SH.sum,v=$('v-app');
  v.innerHTML=`<header><a class="nav" href="#c/${CAMP.id}">‹ Campanha</a><h2 style="margin:0;font-size:30px;flex:1">${esc(s.name||'Sem nome')}</h2><span class="tag">RESUMO</span></header><div class="rule"></div><div class="sum"><div class="art has">${s.img?`<img alt="" src="${s.img}">`:''}</div><div><h2>Atributos</h2>${A.map(([k,n])=>{const x=(s.attrs&&s.attrs[k])||0;return `<div class="at"><span class="an">${n}</span><span class="ch">${x}</span><span class="mod">${fm(mod(x))}</span></div>`}).join('')}<p class="mut">Versão resumida: somente o dono da ficha e o mestre veem os demais dados.</p></div></div>`}
function potHeader(){const camp=CUR==='cpot';$('lnkPBack').href=camp?'#c/'+CAMP.id:'#s/'+SH.id;$('lnkPBack').textContent=camp?'‹ Campanha':'‹ Voltar à ficha';$('ptitle').textContent=camp?'Poções da Campanha':'Habilidades da Poção'}
const show=n=>{['app','ficha','pocao'].forEach(x=>$('v-'+x).hidden=x!==n);$('log').hidden=true};
let routing=0;
async function route(){const my=++routing;
  try{
    if(pending())await flush();
    const seg=location.hash.replace(/^#\/?/,'').split('/');
    if(!ME){CUR='auth';show('app');renderAuth();renderBar();return}
    if(seg[0]==='c'&&seg[1]){
      if(!CAMP||CAMP.id!==seg[1]){UI.edit=false}SH=null;await loadCamp(seg[1]);listen(seg[1]);if(my!==routing)return;
      if(seg[2]==='pocao'){CUR='cpot';PX={mode:'camp',path:''};show('pocao');potHeader();renderPot()}else{CUR='camp';show('app');renderCamp()}
    }else if(seg[0]==='s'&&seg[1]){
      const r=await api('GET','/api/sheets/'+seg[1]);if(!CAMP||CAMP.id!==r.campaign_id)UI.edit=false;await loadCamp(r.campaign_id);listen(r.campaign_id);if(my!==routing)return;
      if(r.summaryOnly){SH={id:seg[1],owner_id:r.owner_id,rev:r.rev,summary:true,sum:r.summary};CUR='sum';show('app');renderSummary()}
      else{SH={id:seg[1],owner_id:r.owner_id,rev:r.rev};BASE=clone(r.data||{});S=norm(r.data);PX={mode:'sheet',path:''};
        $('lnkBack').href='#c/'+CAMP.id;$('lnkPocao').href='#s/'+SH.id+'/pocao';
        if(seg[2]==='pocao'){CUR='spot';show('pocao');potHeader()}else{CUR='sheet';show('ficha')}render()}
    }else{stopES();CAMP=null;SH=null;CUR='camps';show('app');await renderCamps()}
    if(my===routing){renderBar();scrollTo(0,0)}
  }catch(e){
    if(e.status===401){ME=null;if(my===routing)route();return}
    toast(e.message);if(location.hash!=='#camps'){SH=null;location.hash='#camps'}else{show('app');$('v-app').innerHTML='<p class="mut">Não foi possível carregar.</p>'}}}
async function boot(){try{ME=(await api('GET','/api/me')).user}catch(e){ME=null}route()}

$('camada').innerHTML=L.map(n=>`<option>${n}</option>`).join('');
$('apt').innerHTML='<option value="">APTIDÃO</option>'+Object.keys(APT).map(a=>`<option>${a}</option>`).join('');
$('nsa').innerHTML=A.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');
$('leg').innerHTML=LV.map((l,i)=>`<span><i style="--c:var(--l${i})"></i>${l}${i?' +'+i:''}</span>`).join('')+'<span>Clique no nome da perícia para mudar o nível. * Especial: sem treino, rola com desvantagem (−1d6).</span>';
$('name').oninput=e=>{S.name=e.target.value;save()};$('apt').onchange=e=>{S.apt=e.target.value;render()};
$('camada').onchange=e=>{S.camada=+e.target.value;render()};
$('addtal').onclick=()=>{S.tals.push({t:'',d:''});render()};
$('addsk').onclick=()=>{const n=$('nsk').value.trim();if(!n)return;S.skills.push({n,a:$('nsa').value,sp:$('nsp').checked?1:0,l:0,c:1});$('nsk').value='';render()};
bindImg('art','img','rm');
$('part').querySelector('input').onchange=e=>{if(isMaster())readImg(e,d=>{CP.pimgs[pxPath()]=d;savePot();repaint()})};$('prm').onclick=()=>{delete CP.pimgs[pxPath()];savePot();repaint()};
$('expFicha').onclick=()=>download((S.name||'ficha')+'.json',{kind:'ficha',version:1,data:S});
$('rollx').onclick=doRoll;$('expr').onkeydown=e=>{if(e.key==='Enter')doRoll()};
addEventListener('hashchange',route);
boot();
</script>
</body>
