# Blueprint do Render: um Web Service (Node) + um banco PostgreSQL.
databases:
  - name: ficha-db
    databaseName: ficha
    user: ficha
    plan: free          # confira no painel do Render as regras atuais do plano gratuito

services:
  - type: web
    name: ficha-virtual
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: ficha-db
          property: connectionString
